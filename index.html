const CONFIG = {
  /* 頁籤標題 */

  /* 主圖：圖片和 html 放同一個資料夾 */
  heroImage: "valorant-event.png",

  /* 上方文字 */
  eyebrow: "石二鍋期間限定優惠券",

  /* 資訊卡 */
  rewardLabel: "活動內容",

  claimTitleLine1: "一鍵領取",
  claimTitleLine2: "滿200折200優惠券",
  claimDesc: "每桌每次限用一張，不適用於外送平台，不得與其他優惠、會員折扣及兌換活動併用。數量有限，送完為止。",
  claimButtonText: "前往立即領取",
  claimSafeText: "內用／外帶適用・每桌每次限用一張",

  /* 底部小字 */
  footerText: "※ 優惠券使用期限：2026/11/07～2026/11/18。石二鍋保有活動最終解釋權，數量有限，送完為止。"

</script>

<title></title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    "PingFang TC",
    Arial,
    sans-serif;
  background:#06080b;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 2%, rgba(255,49,73,.16), transparent 24%),
    radial-gradient(circle at 92% 24%, rgba(255,49,73,.10), transparent 28%),
    radial-gradient(circle at 10% 88%, rgba(255,49,73,.07), transparent 24%),
    linear-gradient(145deg,#06080b 0%, #0a0e13 55%, #10070c 100%);
}

.bg-grid{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.10;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom, black, rgba(0,0,0,.15));
}

.glow{
  position:fixed;
  border-radius:50%;
  filter:blur(88px);
  pointer-events:none;
  z-index:0;
}
.glow.one{
  width:260px;height:260px;top:-110px;right:-70px;
  background:rgba(255,44,66,.20);
}
.glow.two{
  width:230px;height:230px;bottom:90px;left:-90px;
  background:rgba(255,30,52,.14);
}

.page{
  width:min(100%, 760px);
  margin:0 auto;
  padding:18px 16px 40px;
  position:relative;
  z-index:1;
}

.hero{
  overflow:hidden;
  border-radius:22px;
  border:1px solid rgba(255,86,102,.28);
  background:#0a0d12;
  box-shadow:
    0 18px 48px rgba(0,0,0,.50),
    0 0 28px rgba(255,38,56,.10);
}
.hero img{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:16/9;
  object-fit:cover;
}

.intro{
  margin-top:22px;
  text-align:center;
  padding:0 8px;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,50,73,.08);
  border:1px solid rgba(255,73,94,.34);
  color:#ff6a7c;
  font-size:11px;
  font-weight:1000;
  letter-spacing:.16em;
}
.eyebrow::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:#ff334b;
  box-shadow:0 0 10px #ff334b;
}

h1{
  margin:14px 0 8px;
  font-size:36px;
  line-height:1.12;
  font-weight:1000;
  letter-spacing:-.03em;
  text-shadow:0 0 18px rgba(255,45,68,.16);
}
.subtitle{
  width:min(100%, 600px);
  margin:0 auto;
  color:#b9c0ca;
  font-size:14px;
  line-height:1.8;
}

.info{
  margin-top:24px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg, rgba(17,64,30,.96), rgba(5,35,17,.96));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 15px 38px rgba(0,0,0,.32);
}
.row{
  display:flex;
  align-items:flex-start;
  gap:14px;
  padding:13px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.035);
}
.row + .row{margin-top:10px}
.label{
  flex:0 0 84px;
  color:#ff6d7d;
  font-size:13px;
  font-weight:900;
}
.value{
  flex:1;
  color:#f5f7fa;
  font-size:14px;
  line-height:1.56;
  word-break:break-word;
}

/* ===== 領取區塊：改成參考圖那種字體視覺 ===== */
.claim-panel{
  margin-top:22px;
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg, #174821, #082c16);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 20px 46px rgba(0,0,0,.42);
}
.claim-tag{
  color:#efd28a;
  font-size:13px;
  font-weight:1000;
  letter-spacing:.10em;
  text-transform:uppercase;
}
.claim-title{
  margin-top:12px;
  font-weight:1000;
  line-height:1.10;
  letter-spacing:-.03em;
  color:#fff;
}
.claim-title .line1{
  display:block;
  font-size:40px;
}
.claim-title .line2{
  display:block;
  margin-top:4px;
  font-size:40px;
}
.claim-desc{
  margin-top:14px;
  color:#d7dfc7;
  font-size:14px;
  line-height:1.75;
  max-width:560px;
}
.claim-button-wrap{
  margin-top:22px;
}
.claim-button{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  background:#f5e5b4;
  color:#153d20;
  font-size:20px;
  font-weight:1000;
  letter-spacing:.02em;
  box-shadow:
    0 8px 22px rgba(0,0,0,.20),
    0 0 0 1px rgba(255,255,255,.10) inset;
  transition:transform .16s ease, filter .16s ease;
}
.claim-button::after{
  content:"→";
  margin-left:10px;
  font-size:22px;
}
.claim-button:hover{filter:brightness(1.03)}
.claim-button:active{transform:scale(.988)}

.claim-safe{
  margin-top:12px;
  text-align:center;
  color:#c0d0ae;
  font-size:12px;
  font-weight:800;
}
.claim-safe::before{
  content:"";
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:7px;
  border-radius:50%;
  background:#22db79;
  box-shadow:0 0 8px #22db79;
  vertical-align:middle;
}

.footer{
  margin-top:14px;
  text-align:center;
  color:#767e8a;
  font-size:11px;
  line-height:1.6;
}

@media(max-width:560px){
  .page{padding:12px 10px 32px}
  .hero{border-radius:16px}
  h1{font-size:31px}
  .info{padding:13px}
  .row{gap:10px;padding:12px}
  .label{flex-basis:72px;font-size:12px}
  .value{font-size:13px}
  .claim-panel{padding:18px;border-radius:20px}
  .claim-title .line1,
  .claim-title .line2{font-size:32px}
  .claim-button{font-size:18px;min-height:54px}
}

/* 石二鍋風格背景：深綠、奶油金、暖木色光影；原有版面保持不變 */
body { background:#062b17; }
body::before {
  background:
    radial-gradient(ellipse at 12% 8%, rgba(113,153,53,.26), transparent 35%),
    radial-gradient(ellipse at 88% 25%, rgba(221,184,91,.20), transparent 34%),
    radial-gradient(ellipse at 22% 92%, rgba(61,116,44,.28), transparent 38%),
    linear-gradient(155deg,#0c3d20 0%,#052713 55%,#142c12 100%);
}
.bg-grid { opacity:.14; background-image:repeating-linear-gradient(35deg,rgba(214,190,118,.16) 0 1px,transparent 1px 44px); mask-image:none; }
.glow.one { background:rgba(119,164,49,.25); }
.glow.two { background:rgba(201,161,69,.20); }
/* 讓深色內容卡片與原本白色字體維持可讀性，只調整外圍裝飾色 */
.hero { border-color:rgba(220,191,110,.52); box-shadow:0 18px 48px rgba(0,16,6,.35),0 0 28px rgba(208,180,89,.12); }
.eyebrow { background:rgba(220,191,110,.12);border-color:rgba(220,191,110,.40);color:#f3df9a; }
.eyebrow::before { background:#dfc36c;box-shadow:0 0 10px rgba(223,195,108,.45); }
h1 { color:#fff3cf;text-shadow:none; }
.subtitle { color:#d1dcc4; }
.info { border-color:rgba(220,191,110,.38); }
.label { color:#e7cf85; }
.footer { color:#bbc9aa; }

</style>
</head>

<body>

<div class="bg-grid"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="page">

  <section class="hero">
    <img id="hero-image" alt="">
  </section>

  <section class="intro">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </section>

  <section class="info">
    <div class="row">
      <div class="label" id="reward-label"></div>
      <div class="value" id="reward-text"></div>
    </div>
    <div class="row">
      <div class="label" id="time-label"></div>
      <div class="value" id="time-text"></div>
    </div>
  </section>

  <section class="claim-panel">
    <div class="claim-tag" id="claim-tag"></div>

    <div class="claim-title">
      <span class="line1" id="claim-line1"></span>
      <span class="line2" id="claim-line2"></span>
    </div>

    <div class="claim-desc" id="claim-desc"></div>

    <div class="claim-button-wrap">
      <a
        id="claim-button"
        class="claim-button"
        href="#"
        rel="noopener noreferrer">
      </a>
    </div>

    <div class="claim-safe" id="claim-safe"></div>
  </section>

  <div class="footer" id="footer"></div>

</main>

<script>
const $ = (id) => document.getElementById(id);

document.title = CONFIG.pageTitle;

$("hero-image").src = CONFIG.heroImage;
$("hero-image").alt = CONFIG.heroAlt;

$("eyebrow").textContent = CONFIG.eyebrow;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

$("reward-label").textContent = CONFIG.rewardLabel;
$("reward-text").textContent = CONFIG.rewardText;

$("time-label").textContent = CONFIG.timeLabel;
$("time-text").textContent = CONFIG.timeText;


$("claim-tag").textContent = CONFIG.claimTag;
$("claim-line1").textContent = CONFIG.claimTitleLine1;
$("claim-line2").textContent = CONFIG.claimTitleLine2;
$("claim-desc").textContent = CONFIG.claimDesc;
$("claim-button").textContent = CONFIG.claimButtonText;
$("claim-button").href = CONFIG.lineLink;
$("claim-safe").textContent = CONFIG.claimSafeText;

$("footer").textContent = CONFIG.footerText;
</script>

</body>
</html>
